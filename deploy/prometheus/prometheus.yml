global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: signal-bot
    static_configs:
      - targets: ["bot:8080"]
    # The optional second paper bot (compose profile "tp") is found by its container
    # name, so it has no target at all (and raises no BotDown) unless it is running.
    dns_sd_configs:
      - names: ["bot-tp"]
        type: A
        port: 8080
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        regex: bot-tp
        target_label: instance
        replacement: bot-tp:8080
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: alertmanager
    static_configs:
      - targets: ["alertmanager:9093"]
  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]
  - job_name: alloy
    static_configs:
      - targets: ["alloy:12345"]
