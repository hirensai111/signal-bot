[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "signal-bot"
version = "2.2.0"
description = "Fault-tolerant, event-driven crypto futures research, paper-trading and execution platform"
requires-python = ">=3.11"
dependencies = [
    "python-binance>=1.0.19",
    "python-telegram-bot>=21.0",
    "APScheduler>=3.10.0",
    "sqlalchemy[asyncio]>=2.0.25",
    "asyncpg>=0.29.0",
    "aiosqlite>=0.19.0",
    "pydantic-settings>=2.1.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "aiohttp>=3.9.0",
    "pyarrow>=14.0.0",
    "prometheus-client>=0.19.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
    "pip-audit>=2.7.0",
    "pyyaml>=6.0",
]

[project.scripts]
signal-bot = "signal_bot.main:cli"
signal-bot-research = "signal_bot.research.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["signal_bot*"]

[tool.setuptools.package-data]
"signal_bot" = ["db/schema.sql", "observability/static/*", "research/strategies/*.toml", "research/*.json"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "postgres: requires a PostgreSQL database at TEST_POSTGRES_URL",
    "scenario: end-to-end failure-injection scenario",
    "replay: deterministic replay / golden-report test",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "ASYNC", "UP"]
ignore = [
    "E501",   # line length is enforced by the formatter
    "E741",   # `l` as a candle-low variable name is used throughout the strategy code
    "B008",
    "UP017",  # datetime.UTC alias; keep timezone.utc for readability
    "ASYNC109",
    "ASYNC110",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "B017", "ASYNC"]

[tool.ruff.lint.isort]
known-first-party = ["signal_bot"]
