# The main strategy (trend_portfolio.toml) betting twice as much: identical entries, exit and
# universe, with every percentage account rule doubled together, as backtested in
# docs/research.md ("Account size, risk and leverage"): 1% risk per trade, 6% open risk,
# 4% correlated risk, risk halved at 20% drawdown, entries stopped at 40%.
# Runs on the Binance demo bot (docker-compose bot-bn) to forward-test 1% next to the
# three 0.5% paper bots.  [params] must equal trend_breakout.toml (tests/test_portfolio.py).
name = "trend_portfolio_1pct"
version = "0.1.0"
strategy = "trend_breakout"
signal_config = "signal_bot/research/strategies/trend_breakout.toml"
description = "Trend breakout 0.2.0 across the Delta India perpetual universe with shared equity: 1% risk per trade on marked-to-market equity, whole contracts, at most 6 positions, 6% total open risk, 4% correlation-adjusted risk, 3x gross leverage, 3 entries per bar, risk halved at 20% drawdown and entries stopped at 40% (every rule of trend_portfolio doubled)."

[params]
timeframe = "4h"
entry_lookback = 55
atr_n = 20
stop_atr = 2.0
trail_atr = 3.0
trend_ema = 200
breakout_volume_mult = 1.5
allow_short = true
max_hold_bars = 180
min_stop_bps = 0.0

[portfolio]
risk_per_trade = 0.01
max_positions = 6
max_open_risk = 0.06
max_correlated_risk = 0.04
max_gross_leverage = 3.0
max_entries_per_bar = 3
drawdown_reduce = 0.20
drawdown_risk_scale = 0.5
drawdown_halt = 0.40
correlation_lookback_bars = 180
correlation_min_bars = 60
position_leverage = 5

[universe]
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "DOGEUSDT", "BNBUSDT", "ADAUSDT", "LINKUSDT", "LTCUSDT", "AVAXUSDT", "DOTUSDT"]
venue = "delta_india"
contracts = "signal_bot/research/delta_universe.json"
respect_listing_dates = true

[costs]
taker_fee = 0.0005
maker_fee = 0.0002
half_spread_bps = 1.0
impact_coef = 0.5
max_participation = 0.05
max_entry_slippage_bps = 30.0
funding_rate_8h = 0.0001

[sizing]
initial_equity = 10000.0
risk_fraction = 0.01
max_leverage = 5.0

[validation]
cost_multipliers = [0.0, 0.5, 1.0, 1.5, 2.0, 3.0]
random_baseline_runs = 50
seed = 20261102
window_days = 90
