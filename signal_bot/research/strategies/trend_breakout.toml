# Higher-timeframe trend following with an exchange-native trailing stop.
name = "trend_breakout"
version = "0.2.0"
strategy = "trend_breakout"
description = "Donchian breakout on 4h bars, only in the direction of the 200-bar EMA and only on above-average volume: 2 ATR initial stop, 3 ATR constant-distance trailing stop (Delta bracket_trail_amount), no fixed target. Chosen on 2021-01..2025-09 development data as the centre of a stable parameter plateau."

[params]
timeframe = "4h"
entry_lookback = 55
atr_n = 20
stop_atr = 2.0
trail_atr = 3.0
trend_ema = 200
breakout_volume_mult = 1.5
allow_short = true
max_hold_bars = 180
min_stop_bps = 0.0

[costs]
taker_fee = 0.0005
maker_fee = 0.0002
half_spread_bps = 1.0
impact_coef = 0.5
max_participation = 0.05
max_entry_slippage_bps = 30.0
funding_rate_8h = 0.0001

[sizing]
initial_equity = 10000.0
risk_fraction = 0.005
max_leverage = 5.0

[validation]
oos_fraction = 0.33
walk_forward_train_days = 365
walk_forward_test_days = 90
cost_multipliers = [0.0, 0.5, 1.0, 1.5, 2.0, 3.0]
random_baseline_runs = 50
seed = 20261101
min_oos_trades = 30
