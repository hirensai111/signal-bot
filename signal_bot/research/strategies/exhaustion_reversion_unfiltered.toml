# Strategy release config. Any change here changes config_hash in every report.
name = "exhaustion_reversion_unfiltered"
version = "0.1.0"
strategy = "exhaustion_reversion"
description = "Exhaustion reversion without the no-trade regime filter, kept to measure what the filter contributes."

[params]
timeframe = "5m"
run_bars = 4
run_atr = 2.5
climax_vol_z = 2.0
vol_window = 50
stop_atr_buffer = 1.0
min_stop_bps = 30.0
reward_risk = 1.5
max_hold_bars = 36

[regime_filter]
enabled = false
min_vol_pct = 0.20
max_vol_pct = 0.97
max_trend_er = 0.5
er_window = 48
rank_window = 2000

[costs]
taker_fee = 0.0005
maker_fee = 0.0002
half_spread_bps = 1.0
impact_coef = 0.5
max_participation = 0.05
max_entry_slippage_bps = 15.0
funding_rate_8h = 0.0001

[sizing]
initial_equity = 10000.0
risk_fraction = 0.005
max_leverage = 10.0

[validation]
oos_fraction = 0.33
walk_forward_train_days = 90
walk_forward_test_days = 30
cost_multipliers = [0.0, 0.5, 1.0, 1.5, 2.0, 3.0]
random_baseline_runs = 50
seed = 20261101
min_oos_trades = 30

[walk_forward.grid]
run_atr = [2.0, 2.5, 3.0]
climax_vol_z = [1.5, 2.0, 2.5]
