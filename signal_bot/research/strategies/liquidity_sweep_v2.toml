# The production sweep entries with cost-aware management (see LiquiditySweepV2).
name = "liquidity_sweep_v2"
version = "0.1.0"
strategy = "liquidity_sweep_v2"
description = "Production liquidity-sweep entries and stops, skipping stops tighter than 40 bps, with a fixed 2R target instead of the far HTF-level target."

[params]
timeframe = "5m"
min_stop_bps = 40.0
target_r = 2.0
trail_r = 0.0

[costs]
taker_fee = 0.0005
maker_fee = 0.0002
half_spread_bps = 1.0
impact_coef = 0.5
max_participation = 0.05
max_entry_slippage_bps = 15.0
funding_rate_8h = 0.0001

[sizing]
initial_equity = 10000.0
risk_fraction = 0.005
max_leverage = 10.0

[validation]
oos_fraction = 0.33
walk_forward_train_days = 90
walk_forward_test_days = 30
cost_multipliers = [0.0, 0.5, 1.0, 1.5, 2.0, 3.0]
random_baseline_runs = 50
seed = 20261101
min_oos_trades = 30
