# The trend portfolio with the fixed +1.5R exit (trend_breakout_tp15), for the second
# paper bot.  Everything except [params] (and the names) is identical to trend_portfolio.toml,
# so the two paper bots differ only in how a trade exits.
# [params] must equal trend_breakout_tp15.toml (tests/test_portfolio.py checks).
name = "trend_portfolio_tp15"
version = "0.1.0"
strategy = "trend_breakout"
signal_config = "signal_bot/research/strategies/trend_breakout_tp15.toml"
description = "Trend breakout with a fixed +1.5R take-profit and no trailing stop (trend_breakout_tp15) across the Delta India perpetual universe with shared equity: 0.5% risk per trade on marked-to-market equity, whole Delta contracts, at most 6 positions, 3% total open risk, 2% correlation-adjusted risk, 3x gross leverage, 3 entries per bar, risk halved at 10% drawdown and entries stopped at 20%."

[params]
timeframe = "4h"
entry_lookback = 55
atr_n = 20
stop_atr = 2.0
trail_atr = 0.0
trend_ema = 200
breakout_volume_mult = 1.5
allow_short = true
max_hold_bars = 180
min_stop_bps = 0.0
take_profit_r = 1.5

[portfolio]
risk_per_trade = 0.005
max_positions = 6
max_open_risk = 0.03
max_correlated_risk = 0.02
max_gross_leverage = 3.0
max_entries_per_bar = 3
drawdown_reduce = 0.10
drawdown_risk_scale = 0.5
drawdown_halt = 0.20
correlation_lookback_bars = 180
correlation_min_bars = 60
position_leverage = 5

[universe]
symbols = ["BTCUSDT", "ETHUSDT", "SOLUSDT", "XRPUSDT", "DOGEUSDT", "BNBUSDT", "ADAUSDT", "LINKUSDT", "LTCUSDT", "AVAXUSDT", "DOTUSDT"]
venue = "delta_india"
contracts = "signal_bot/research/delta_universe.json"
respect_listing_dates = true

[costs]
taker_fee = 0.0005
maker_fee = 0.0002
half_spread_bps = 1.0
impact_coef = 0.5
max_participation = 0.05
max_entry_slippage_bps = 30.0
funding_rate_8h = 0.0001

[sizing]
initial_equity = 10000.0
risk_fraction = 0.005
max_leverage = 5.0

[validation]
cost_multipliers = [0.0, 0.5, 1.0, 1.5, 2.0, 3.0]
random_baseline_runs = 50
seed = 20261102
window_days = 90
